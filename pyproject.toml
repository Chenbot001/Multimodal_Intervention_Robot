[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vait"
version = "0.1.0"
description = "VAIT - Visuotactile-Assisted Intervention Technology"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "pynput>=1.7.6",
    "minimalmodbus>=2.0.1",
    "numpy>=1.21.0,<1.25.0",
    "opencv-python>=4.6.0",
    "opencv-contrib-python>=4.6.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.1.0",
    "ur-rtde>=1.5.5",
    "pysoem>=1.0.8",
    "keyboard>=0.13.5",
    "wmi>=1.5.1; platform_system=='Windows'"
]

[project.optional-dependencies]
linux = [
    "tkinter-dev; platform_system=='Linux'"
]

[tool.setuptools.packages.find]
where = ["src"]
